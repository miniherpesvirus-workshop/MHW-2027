<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Mini Herpesvirus Workshop 2027. A European meeting in Rotterdam, the Netherlands, on 23–24 September 2027. Organisers: Georges Verjans, Werner Ouwendijk and Michiel van Gent.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mini Herpesvirus Workshop 2027 · Rotterdam">
  <meta property="og:description" content="23–24 September 2027 · Rotterdam, the Netherlands. Programme and registration details will follow.">

  <title>Mini Herpesvirus Workshop 2027 · Rotterdam</title>

  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #202b36;
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .page {
      width: min(1040px, calc(100% - 64px));
      margin: 0 auto;
      padding: 64px 0 40px;
    }

    .skip-link {
      position: absolute;
      left: 16px;
      top: 0;
      padding: 12px;
      color: #202b36;
      background: #fff;
      transform: translateY(-110%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    a:focus-visible {
      outline: 2px solid #285888;
      outline-offset: 4px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 4.1vw, 2.85rem);
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -.035em;
    }

    .date {
      margin: 0 0 5px;
      font-size: 1.25rem;
      line-height: 1.5;
      font-weight: 600;
    }

    .location {
      margin: 0;
      color: #52606d;
      font-size: 1rem;
      line-height: 1.6;
    }

    .photo {
      margin: 32px 0 30px;
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .organisers h2 {
      margin: 0 0 10px;
      font-size: .85rem;
      line-height: 1.5;
      font-weight: 600;
      color: #52606d;
    }

    .organisers ul {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 28px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 1rem;
      line-height: 1.7;
    }

    .more {
      margin: 24px 0 0;
      font-size: .9rem;
      line-height: 1.6;
      color: #52606d;
    }

    @media (max-width: 600px) {
      .page {
        width: calc(100% - 32px);
        padding-top: 32px;
      }

      h1 {
        font-size: 2rem;
      }

      .date {
        font-size: 1.1rem;
      }

      .location {
        font-size: .9rem;
      }

      .photo {
        margin-block: 24px;
      }

      .organisers ul {
        display: block;
      }
    }

    @media print {
      .page {
        width: 100%;
        padding: 0;
      }

      .skip-link {
        display: none;
      }

      .photo {
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main class="page" id="main">
    <header>
      <h1>Mini Herpesvirus Workshop 2027</h1>
      <p class="date">23–24 September 2027</p>
      <p class="location">Rotterdam, the Netherlands · European meeting</p>
    </header>

    <figure class="photo">
      <img
        src="assets/rotterdam.png"
        width="2048"
        height="819"
        fetchpriority="high"
        alt="Rotterdam collage showing the Erasmus Bridge and city skyline at night, Hotel New York and the yellow Cube Houses"
      >
    </figure>

    <section class="organisers" aria-labelledby="organisers-title">
      <h2 id="organisers-title">Organisers</h2>
      <ul>
        <li>Georges Verjans</li>
        <li>Werner Ouwendijk</li>
        <li>Michiel van Gent</li>
      </ul>
    </section>

    <p class="more">Programme and registration details will follow.</p>
  </main>
</body>
</html>
